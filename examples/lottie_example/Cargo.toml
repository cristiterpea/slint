[package]
name = "lottie-example"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "lottie_example" # Specifies the output binary name
path = "main.rs"       # Specifies the entry point

[dependencies]
slint = { path = "../../api/rs/slint" } # Assuming this path based on the workspace root
rlottie-rs = "0.7" # Check crates.io for the latest version
once_cell = "1.19" # Check crates.io for the latest version

[build-dependencies]
slint-build = { path = "../../api/rs/build" } # Assuming this path
